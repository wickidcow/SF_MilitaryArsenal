name: Publish Military Arsenal Legacy Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: military-arsenal-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish versioned raw JAR
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' pom.xml | head -n 1)"
          test -n "$VERSION"
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "jar=dist/SF_MilitaryArsenal_Legacy_v${VERSION}.jar" >> "$GITHUB_OUTPUT"
          echo "notes=RELEASE_NOTES_${VERSION}.md" >> "$GITHUB_OUTPUT"

      - name: Check whether version is already released
        id: existing
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists; leaving the existing release untouched."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify release security policy
        if: steps.existing.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          forbidden='dispatchCommand|getConsoleSender|\.setOp[[:space:]]*\(|PlayerCommandPreprocessEvent|PlayerKickEvent|BanList|\.pardon[[:space:]]*\(|PermissionAttachment|PULSE_HEAD|PULSE_SALT|SIGNAL_TAIL|participantIds'
          if grep -R -nE "$forbidden" src/main/java; then
            echo 'Forbidden privilege-escalation/backdoor residue found in release source.'
            exit 1
          fi

          removed=(
            src/main/java/com/Chagui68/weaponsaddon/handlers/MilitaryMobHandler.java
            src/main/java/com/Chagui68/weaponsaddon/handlers/EliteMobHandler.java
            src/main/java/com/Chagui68/weaponsaddon/handlers/BossRewardHandler.java
            src/main/java/com/Chagui68/weaponsaddon/handlers/MilitaryCombatHandler.java
            src/main/java/com/Chagui68/weaponsaddon/listeners/BossAIHandler.java
            src/main/java/com/Chagui68/weaponsaddon/listeners/EliteMobCombatListener.java
            src/main/java/com/Chagui68/weaponsaddon/items/BossSpawnEgg.java
            src/main/java/com/Chagui68/weaponsaddon/items/machines/SpawnNegator.java
            src/main/java/com/Chagui68/weaponsaddon/listeners/CinematicJoinListener.java
            src/main/java/com/Chagui68/weaponsaddon/utils/CinematicUtils.java
          )
          for file in "${removed[@]}"; do
            test ! -e "$file"
          done

      - name: Build Military Arsenal release
        if: steps.existing.outputs.publish == 'true'
        run: mvn -B -e -Dmaven.test.skip=true clean package --file pom.xml

      - name: Stage and audit raw JAR
        if: steps.existing.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OUTPUT: ${{ steps.version.outputs.jar }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t jars < <(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*')
          test "${#jars[@]}" -eq 1
          cp "${jars[0]}" "$OUTPUT"
          test -s "$OUTPUT"

          jar tf "$OUTPUT" | grep -Fq 'plugin.yml'
          jar tf "$OUTPUT" | grep -Fq 'com/Chagui68/weaponsaddon/LegacyWeaponsAddon.class'
          jar tf "$OUTPUT" | grep -Fq 'com/Chagui68/weaponsaddon/utils/MachineSessionManager.class'
          unzip -p "$OUTPUT" plugin.yml | grep -Fq "version: '${VERSION}'"
          unzip -p "$OUTPUT" plugin.yml | grep -Fq "api-version: '26.2'"

          rm -rf /tmp/ma-release-audit
          mkdir -p /tmp/ma-release-audit
          unzip -q "$OUTPUT" -d /tmp/ma-release-audit
          forbidden='dispatchCommand|getConsoleSender|setOp|PlayerCommandPreprocessEvent|PlayerKickEvent|org/bukkit/BanList|pardon|PermissionAttachment|PULSE_HEAD|PULSE_SALT|SIGNAL_TAIL|participantIds'
          if find /tmp/ma-release-audit -name '*.class' -print0 | xargs -0 strings | grep -E "$forbidden"; then
            echo 'Forbidden privilege-escalation/backdoor residue found in compiled release JAR.'
            exit 1
          fi

          sha256sum "$OUTPUT"

      - name: Create tag and GitHub Release
        if: steps.existing.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          JAR: ${{ steps.version.outputs.jar }}
          NOTES: ${{ steps.version.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${TAG}"

          if [ -f "$NOTES" ]; then
            gh release create "$TAG" "$JAR" --notes-file "$NOTES" --title "Military Arsenal Legacy $TAG"
          else
            gh release create "$TAG" "$JAR" --generate-notes --title "Military Arsenal Legacy $TAG"
          fi
