name: Build Military Arsenal Legacy

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: military-arsenal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LEGACY_ARTIFACT_VERSION: "1.1.3"
  OUTPUT_NAME: "SF_MilitaryArsenal1.1.3.jar"

jobs:
  build:
    name: Build with Java 25
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify Legacy build metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<version>1.1.3</version>' pom.xml
          grep -Fq '<paper.version>[26.2.build,)</paper.version>' pom.xml
          grep -Fq '<maven.compiler.release>21</maven.compiler.release>' pom.xml
          grep -Fq 'main: com.Chagui68.weaponsaddon.LegacyWeaponsAddon' src/main/resources/plugin.yml
          grep -Fq 'depend: [Slimefun]' src/main/resources/plugin.yml
          grep -Fq 'loadbefore: [Networks]' src/main/resources/plugin.yml
      - name: Verify source security policy
        shell: bash
        run: |
          set -euo pipefail
          forbidden='dispatchCommand|getConsoleSender|\.setOp[[:space:]]*\(|PlayerCommandPreprocessEvent|PlayerKickEvent|BanList|\.pardon[[:space:]]*\(|PermissionAttachment|PULSE_HEAD|PULSE_SALT|SIGNAL_TAIL|participantIds'
          if grep -R -nE "$forbidden" src/main/java; then
            echo 'Forbidden privilege-escalation/backdoor residue found in Military Arsenal source.'
            exit 1
          fi
          if grep -Eq 'case[[:space:]]+"(give|summon)"' src/main/java/com/Chagui68/weaponsaddon/commands/WeaponsCommand.java; then
            echo 'Unsafe admin give/summon command path was reintroduced.'
            exit 1
          fi
      - name: Verify removed mob system stays removed
        shell: bash
        run: |
          set -euo pipefail
          removed=(
            src/main/java/com/Chagui68/weaponsaddon/handlers/MilitaryMobHandler.java
            src/main/java/com/Chagui68/weaponsaddon/handlers/EliteMobHandler.java
            src/main/java/com/Chagui68/weaponsaddon/handlers/BossRewardHandler.java
            src/main/java/com/Chagui68/weaponsaddon/handlers/MilitaryCombatHandler.java
            src/main/java/com/Chagui68/weaponsaddon/listeners/BossAIHandler.java
            src/main/java/com/Chagui68/weaponsaddon/listeners/EliteMobCombatListener.java
            src/main/java/com/Chagui68/weaponsaddon/items/BossSpawnEgg.java
            src/main/java/com/Chagui68/weaponsaddon/items/machines/SpawnNegator.java
            src/main/java/com/Chagui68/weaponsaddon/listeners/CinematicJoinListener.java
            src/main/java/com/Chagui68/weaponsaddon/utils/CinematicUtils.java
          )
          for file in "${removed[@]}"; do test ! -e "$file"; done
      - name: Verify persistent-machine anti-dupe safeguards
        shell: bash
        run: |
          set -euo pipefail
          manager=src/main/java/com/Chagui68/weaponsaddon/utils/MachineSessionManager.java
          test -f "$manager"
          grep -Fq 'EventPriority.HIGHEST' "$manager"
          grep -Fq 'InventoryClickEvent' "$manager"
          grep -Fq 'InventoryDragEvent' "$manager"
          grep -Fq 'event.isShiftClick()' "$manager"
          for file in src/main/java/com/Chagui68/weaponsaddon/items/machines/MilitaryCraftingHandler.java src/main/java/com/Chagui68/weaponsaddon/items/machines/MachineFabricatorHandler.java src/main/java/com/Chagui68/weaponsaddon/items/machines/AmmunitionWorkshopHandler.java; do
            grep -Fq 'MachineSessionManager.tryAcquire' "$file"
            grep -Fq 'MachineSessionManager.release' "$file"
          done
      - name: Build Military Arsenal
        run: mvn -B -e -Dmaven.test.skip=true clean package --file pom.xml
      - name: Stage and audit versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t jars < <(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          test "${#jars[@]}" -eq 1
          cp "${jars[0]}" "dist/${OUTPUT_NAME}"
          JAR="dist/${OUTPUT_NAME}"
          test -s "$JAR"
          jar tf "$JAR" | grep -Fq 'plugin.yml'
          jar tf "$JAR" | grep -Fq 'com/Chagui68/weaponsaddon/LegacyWeaponsAddon.class'
          jar tf "$JAR" | grep -Fq 'com/Chagui68/weaponsaddon/utils/MachineSessionManager.class'
          if jar tf "$JAR" | grep -Fq 'LegacyNetworksIntegration.class'; then exit 1; fi
          rm -rf /tmp/ma-jar-audit && mkdir -p /tmp/ma-jar-audit
          unzip -q "$JAR" -d /tmp/ma-jar-audit
          forbidden='dispatchCommand|getConsoleSender|setOp|PlayerCommandPreprocessEvent|PlayerKickEvent|org/bukkit/BanList|pardon|PermissionAttachment|PULSE_HEAD|PULSE_SALT|SIGNAL_TAIL|participantIds'
          if find /tmp/ma-jar-audit -name '*.class' -print0 | xargs -0 strings | grep -E "$forbidden"; then exit 1; fi
          sha256sum "$JAR"
      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
      - name: Publish raw JAR release asset
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${LEGACY_ARTIFACT_VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          NOTES="RELEASE_NOTES_${LEGACY_ARTIFACT_VERSION}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --notes-file "$NOTES" --title "SF_MilitaryArsenal $TAG"
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --generate-notes --title "SF_MilitaryArsenal $TAG"
          fi
