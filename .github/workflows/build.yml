name: Build Military Arsenal Legacy

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: military-arsenal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LEGACY_ARTIFACT_VERSION: "1.1.6"
  OUTPUT_NAME: "SF_MilitaryArsenal1.1.6.jar"

jobs:
  build:
    name: Build universal 1.21.11-26.2 JAR
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify Legacy build metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<version>1.1.6</version>' pom.xml
          grep -Fq '<paper.version>1.21.11-R0.1-SNAPSHOT</paper.version>' pom.xml
          grep -Fq '<maven.compiler.release>21</maven.compiler.release>' pom.xml
          grep -Fq "api-version: '1.21.11'" src/main/resources/plugin.yml
          grep -Fq 'main: com.Chagui68.weaponsaddon.LegacyWeaponsAddon' src/main/resources/plugin.yml
          grep -Fq 'depend: [Slimefun]' src/main/resources/plugin.yml
          grep -Fq 'softdepend: [Towny, ItemsAdder]' src/main/resources/plugin.yml
          grep -Fq 'loadbefore: [Networks]' src/main/resources/plugin.yml
      - name: Verify source security policy
        shell: bash
        run: |
          set -euo pipefail
          forbidden='dispatchCommand|getConsoleSender|\.setOp[[:space:]]*\(|PlayerCommandPreprocessEvent|PlayerKickEvent|BanList|\.pardon[[:space:]]*\(|PermissionAttachment|PULSE_HEAD|PULSE_SALT|SIGNAL_TAIL|participantIds'
          if grep -R -nE "$forbidden" src/main/java; then exit 1; fi
          if grep -Eq 'case[[:space:]]+"(give|summon)"' src/main/java/com/Chagui68/weaponsaddon/commands/WeaponsCommand.java; then exit 1; fi
      - name: Verify removed mob system stays removed
        shell: bash
        run: |
          set -euo pipefail
          removed=(
            src/main/java/com/Chagui68/weaponsaddon/handlers/MilitaryMobHandler.java
            src/main/java/com/Chagui68/weaponsaddon/handlers/EliteMobHandler.java
            src/main/java/com/Chagui68/weaponsaddon/handlers/BossRewardHandler.java
            src/main/java/com/Chagui68/weaponsaddon/handlers/MilitaryCombatHandler.java
            src/main/java/com/Chagui68/weaponsaddon/listeners/BossAIHandler.java
            src/main/java/com/Chagui68/weaponsaddon/listeners/EliteMobCombatListener.java
            src/main/java/com/Chagui68/weaponsaddon/items/BossSpawnEgg.java
            src/main/java/com/Chagui68/weaponsaddon/items/machines/SpawnNegator.java
            src/main/java/com/Chagui68/weaponsaddon/listeners/CinematicJoinListener.java
            src/main/java/com/Chagui68/weaponsaddon/utils/CinematicUtils.java
          )
          for file in "${removed[@]}"; do test ! -e "$file"; done
      - name: Verify persistent-machine anti-dupe safeguards
        shell: bash
        run: |
          set -euo pipefail
          manager=src/main/java/com/Chagui68/weaponsaddon/utils/MachineSessionManager.java
          test -f "$manager"
          grep -Fq 'EventPriority.HIGHEST' "$manager"
          grep -Fq 'InventoryClickEvent' "$manager"
          grep -Fq 'InventoryDragEvent' "$manager"
          grep -Fq 'event.isShiftClick()' "$manager"
      - name: Verify Paper 1.21.11 compile baseline
        run: mvn -B -e -Dmaven.test.skip=true clean package --file pom.xml
      - name: Verify Paper 26.2 compile compatibility
        run: mvn -B -e -Dmaven.test.skip=true -Dpaper.version=26.2.build.111-stable clean package --file pom.xml
      - name: Build release JAR from 1.21.11 baseline
        run: mvn -B -e -Dmaven.test.skip=true -Dpaper.version=1.21.11-R0.1-SNAPSHOT clean package --file pom.xml
      - name: Stage and audit versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t jars < <(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          test "${#jars[@]}" -eq 1
          cp "${jars[0]}" "dist/${OUTPUT_NAME}"
          JAR="dist/${OUTPUT_NAME}"
          test -s "$JAR"
          unzip -p "$JAR" plugin.yml | grep -Fq "api-version: '1.21.11'"
          javap -verbose -classpath "$JAR" com.Chagui68.weaponsaddon.LegacyWeaponsAddon | grep -Fq 'major version: 65'
          jar tf "$JAR" | grep -Fq 'com/Chagui68/weaponsaddon/LegacyWeaponsAddon.class'
          jar tf "$JAR" | grep -Fq 'com/Chagui68/weaponsaddon/ItemsAdderIntegration.class'
          jar tf "$JAR" | grep -Fq 'com/Chagui68/weaponsaddon/utils/MachineSessionManager.class'
          sha256sum "$JAR"
      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
      - name: Publish raw JAR release asset
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${LEGACY_ARTIFACT_VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          NOTES="Compatibility release for Minecraft/Purpur 1.21.11 through Paper/Purpur 26.2. Keeps Java 21 bytecode, ItemsAdder integration, and the existing security/anti-dupe safeguards."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --notes "$NOTES" --title "SF_MilitaryArsenal $TAG"
          fi
