name: Build Military Arsenal Legacy

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: military-arsenal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LEGACY_ARTIFACT_VERSION: "1.0.0"

jobs:
  build:
    name: Build with Java 25
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify Legacy build metadata
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq '<version>1.0.0</version>' pom.xml
          grep -Fq '<paper.version>[26.2.build,)</paper.version>' pom.xml
          grep -Fq '<maven.compiler.release>21</maven.compiler.release>' pom.xml
          grep -Fq '<finalName>SF_MilitaryArsenal_Legacy_v${project.version}</finalName>' pom.xml
          grep -Fq 'main: com.Chagui68.weaponsaddon.LegacyWeaponsAddon' src/main/resources/plugin.yml
          grep -Fq "api-version: '26.2'" src/main/resources/plugin.yml
          grep -Fq 'depend: [Slimefun]' src/main/resources/plugin.yml
          grep -Fq 'softdepend: [Networks]' src/main/resources/plugin.yml

          if grep -Fq 'com.github.drakescraft_labs:slimefun-core' pom.xml; then
            echo 'The Legacy build must not depend on a locally-installed Drake artifact.'
            exit 1
          fi

          if grep -Fq 'com.github.drakescraft_labs:dough-core' pom.xml; then
            echo 'The Legacy build must not depend on a locally-installed Drake Dough artifact.'
            exit 1
          fi

          echo 'Legacy metadata checks passed.'

      - name: Build Military Arsenal
        run: mvn -B -e -Dmaven.test.skip=true clean package --file pom.xml

      - name: Verify generated Legacy source namespace
        shell: bash
        run: |
          set -euo pipefail

          if grep -R --line-number 'com\.github\.drakescraft_labs\.slimefun4' target/legacy-src; then
            echo 'Drake Slimefun namespace remains in the generated Legacy source tree.'
            exit 1
          fi

          grep -R -q 'io\.github\.thebusybiscuit\.slimefun4' target/legacy-src
          echo 'Generated source namespace checks passed.'

      - name: Stage versioned Legacy JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t jars < <(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*')
          test "${#jars[@]}" -eq 1

          OUTPUT="dist/SF_MilitaryArsenal_Legacy_v${LEGACY_ARTIFACT_VERSION}.jar"
          cp "${jars[0]}" "$OUTPUT"
          test -s "$OUTPUT"

          echo "Built: $OUTPUT"
          sha256sum "$OUTPUT"
          jar tf "$OUTPUT" | grep -Fq 'plugin.yml'
          jar tf "$OUTPUT" | grep -Fq 'com/Chagui68/weaponsaddon/LegacyWeaponsAddon.class'
          unzip -p "$OUTPUT" plugin.yml | grep -Fq "version: '${LEGACY_ARTIFACT_VERSION}'"
          unzip -p "$OUTPUT" plugin.yml | grep -Fq "api-version: '26.2'"
          unzip -p "$OUTPUT" plugin.yml | grep -Fq 'main: com.Chagui68.weaponsaddon.LegacyWeaponsAddon'

      - name: Upload direct versioned Legacy JAR
        uses: actions/upload-artifact@v7
        with:
          path: dist/SF_MilitaryArsenal_Legacy_v${{ env.LEGACY_ARTIFACT_VERSION }}.jar
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct JAR release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          JAR="dist/SF_MilitaryArsenal_Legacy_v${LEGACY_ARTIFACT_VERSION}.jar"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --generate-notes --title "Military Arsenal Legacy $TAG"
          fi
